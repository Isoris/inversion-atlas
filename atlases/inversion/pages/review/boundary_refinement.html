  <div id="boundary_refinement" class="page">
    <!-- Mode-B boundary-freshness badge (2026-05-20). Resolves
         candidate_lineage (to find active_version_id) and
         candidate_boundaries (to inspect the active version's stored
         boundaries_refined.json). Surfaces what's on disk for the
         active candidate so reviewers can see what they'd be
         overwriting on save. Fail-soft per core/mode_b_badge.js;
         hidden when no candidate is selected. -->
    <div id="brModeBBadge" class="data-source-badge" style="margin: 8px 32px 0; display: none;"></div>
    <div id="page11Header" style="padding: 22px 32px 0;">
      <h2 style="margin: 0 0 4px; font-size: 16px;">Boundary zone refinement</h2>
      <div id="page11Subtitle" style="color: var(--ink-dim); font-size: 11px; font-family: var(--mono);">
        Refines promoted candidates into approximate left/right boundary zones.
        Hotkeys: <b>E</b> override left, <b>F</b> override right, <b>A</b> accept auto, <b>B</b> save, <b>R</b> reset.
      </div>
    </div>
    <div id="page11Content" style="padding: 14px 32px 32px;">
      <!-- Empty until renderBoundariesPage() runs. Populated DOM:
           - .bnd-toolbar : candidate selector + scan-radius + action buttons + status
           - .bnd-info    : current selection summary
           - .bnd-tracks  : stacked SVG/canvas tracks with zone overlays
           - .bnd-summary : table of left/right edge details -->
    </div>
  </div>
